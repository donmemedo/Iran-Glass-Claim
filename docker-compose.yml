services:
  backend:
    build: ./backend
    ports: ["8003:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args: { API_URL: "http://backend:8000" }
    ports: ["3003:3000"]
    depends_on:
      backend: { condition: service_healthy }
